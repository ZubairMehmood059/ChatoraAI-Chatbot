# Netlify Configuration for Chatora AI
[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"

# Security and cache control headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Asset caching for immutable hashed bundles
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Optional: Proxy /api/* to external Python backend if VITE_API_URL is omitted or deployed as unified domain
# Replace https://your-chatora-backend.onrender.com with your live FastAPI deployment URL
# [[redirects]]
#   from = "/api/*"
#   to = "https://your-chatora-backend.onrender.com/api/:splat"
#   status = 200
#   force = true

# SPA Fallback: Direct all non-file route traffic to index.html for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

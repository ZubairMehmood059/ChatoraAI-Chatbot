{% extends "base.html" %}

{% block content %}
<div class="app expanded" id="app">
  <div class="scrim" id="scrim"></div>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar" aria-label="Sidebar">
    <div class="sb-top">
      <div class="brand">
        <svg viewBox="0 0 32 32" aria-hidden="true" width="28" height="28">
          <path fill="var(--primary)" d="M8 3h16a5 5 0 0 1 5 5v11a5 5 0 0 1-5 5H17l-6 5v-5H8a5 5 0 0 1-5-5V8a5 5 0 0 1 5-5z"/>
          <path fill="var(--on-primary)" d="M16 7.5l1.7 4.3 4.3 1.7-4.3 1.7L16 19.5l-1.7-4.3L10 13.5l4.3-1.7z"/>
        </svg>
        <span class="brand-word">Chatora AI</span>
      </div>
      <div class="grow lbl"></div>
      <button class="ibtn" id="sb-toggle" aria-label="Collapse sidebar" title="Collapse sidebar (Ctrl+\)">
        <svg class="ic" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg>
      </button>
    </div>
    <div class="sb-body">
      <button class="btn-primary" id="new-chat" title="New chat (Alt+N)">
        <svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        <span class="lbl">New chat</span>
      </button>
      <div class="search search-full">
        <input id="q" type="search" placeholder="Search conversations (Ctrl+K)" aria-label="Search conversations">
      </div>
      <nav class="convos" id="convos" aria-label="Conversations"></nav>
    </div>
    <div class="sb-foot">
      <button class="navbtn" id="btn-settings" aria-label="Settings">
        <span class="lbl">Settings</span>
      </button>
    </div>
  </aside>

  <!-- Main Chat Workspace -->
  <main class="main" id="main">
    <header class="topbar" id="topbar">
      <button class="ibtn menu-btn" id="menu-btn" aria-label="Open sidebar">
        <svg class="ic" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div class="model"><span>gemini-3.8-flash</span></div>
      <span class="tb-spacer"></span>
      <button class="ibtn" id="theme-btn" aria-label="Toggle theme" title="Toggle theme">
        <svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </header>

    <div class="scroller" id="scroller">
      <div class="col" id="content"></div>
    </div>

    <div class="composer-wrap">
      <div class="composer-in">
        <form class="composer" id="composer">
          <textarea id="msg" rows="1" placeholder="Message Chatora AI..." aria-label="Message Chatora AI"></textarea>
          <button class="send" id="send" type="submit" aria-label="Send message">
            <svg class="ic" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          </button>
        </form>
        <div class="hint">
          <span>Chatora AI sends prompts to Gemini server-side.</span>
          <span class="kb">Enter to send · Shift+Enter for new line</span>
        </div>
      </div>
    </div>
  </main>
</div>
<script src="/static/js/chat.js"></script>
{% endblock %}

<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Chatora AI{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path fill='%23315C43' d='M8 3h16a5 5 0 0 1 5 5v11a5 5 0 0 1-5 5H17l-6 5v-5H8a5 5 0 0 1-5-5V8a5 5 0 0 1 5-5z'/><path fill='%23FFFFFF' d='M16 7.5l1.7 4.3 4.3 1.7-4.3 1.7L16 19.5l-1.7-4.3L10 13.5l4.3-1.7z'/></svg>">
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/style.css">
  <script>
    (function(){
      var st = null; try{ st = localStorage.getItem('theme'); }catch(e){}
      var th = (st === 'dark' || st === 'light') ? st : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', th);
    })();
  </script>
</head>
<body>
  {% block content %}{% endblock %}
</body>
</html>

      window.addEventListener('unhandledrejection', function(event) {

          r &&
          (r.message === 'WebSocket closed without opened.' ||
            (typeof r.stack === 'string' && r.stack.indexOf('@vite/client') !== -1))
        ) {
          event.preventDefault();
        }
      });
    </script>
